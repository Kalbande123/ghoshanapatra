<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सेवास्पॉट सेंटर - लॉगिन</title>
    
    <!-- सुंदर मराठी फॉन्ट -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- आयकॉन्ससाठी FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Mukta', sans-serif;
        }

        body {
            /* इमेजसारखा आकर्षक बॅकग्राऊंड तयार करण्यासाठी CSS Gradients */
            background: linear-gradient(135deg, #fdfbf7 0%, #fdfbf7 50%, #e67e22 50%, #0f2b5b 50.5%, #0f2b5b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        /* लोगो आणि हेडिंग */
        .logo-box img {
            width: 140px;
            margin-bottom: 15px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #e67e22;
        }

        .divider::before, .divider::after {
            content: '';
            height: 1px;
            width: 30%;
            background-color: #fca5a5;
        }

        .divider i {
            margin: 0 15px;
            background: #fff3e0;
            padding: 8px;
            border-radius: 50%;
            font-size: 14px;
        }

        .heading h2 {
            color: #0f2b5b;
            font-size: 26px;
            font-weight: 800;
        }

        .heading p {
            color: #64748b;
            font-size: 15px;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        /* इनपुट बॉक्सेस */
        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i.icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #e67e22;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #e67e22;
        }

        .input-group .toggle-eye {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
        }

        /* ऑप्शन्स: लक्षात ठेवा आणि विसरलात */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .options label {
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .options a {
            color: #0f2b5b;
            text-decoration: none;
            font-weight: 600;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* लॉगिन बटन */
        .login-btn {
            width: 100%;
            background-color: #e67e22;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.3s;
        }

        .login-btn:hover {
            background-color: #d35400;
        }

        /* OR डिव्हायडर */
        .or-divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .or-divider::before, .or-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e2e8f0;
        }

        .or-divider span {
            padding: 0 15px;
        }

        /* सुरक्षित लॉगिन बॉक्स */
        .secure-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            margin-bottom: 25px;
        }

        .secure-box i {
            color: #2563eb;
            font-size: 24px;
            background: #eff6ff;
            padding: 10px;
            border-radius: 50%;
        }

        .secure-box .text strong {
            display: block;
            color: #0f2b5b;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .secure-box .text p {
            color: #64748b;
            font-size: 13px;
        }

        /* फूटर */
        .footer {
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="logo-box">
            <!-- तुमचा आधी अपलोड केलेला लोगो इथे दिसेल -->
            <img src="logo.png" alt="Sevaspot Center Logo">
        </div>

        <div class="divider">
            <i class="fas fa-shield-alt"></i>
        </div>

        <div class="heading">
            <h2>सुस्वागतम!</h2>
            <p>पुढे जाण्यासाठी कृपया लॉगिन करा</p>
        </div>

        <form action="#" method="POST">
            <div class="input-group">
                <i class="far fa-user icon"></i>
                <input type="text" placeholder="युजर आयडी" required>
            </div>

            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="pwd" placeholder="पासवर्ड" required>
                <i class="far fa-eye-slash toggle-eye" id="togglePwd" onclick="togglePassword()"></i>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> मला लक्षात ठेवा
                </label>
                <a href="#">पासवर्ड विसरलात?</a>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-unlock-alt"></i> लॉगिन करा
            </button>
        </form>

        <div class="or-divider">
            <span>किंवा</span>
        </div>

        <div class="secure-box">
            <i class="fas fa-check-circle"></i>
            <div class="text">
                <strong>सुरक्षित लॉगिन</strong>
                <p>तुमचा डेटा आमच्याकडे पूर्णपणे सुरक्षित आहे.</p>
            </div>
        </div>

        <div class="footer">
            &copy; 2026 सेवास्पॉट सेंटर | सर्व हक्क राखीव
        </div>

    </div>

    <!-- पासवर्ड लपवण्यासाठी/दाखवण्यासाठी छोटी स्क्रिप्ट -->
    <script>
        function togglePassword() {
            var pwdInput = document.getElementById("pwd");
            var icon = document.getElementById("togglePwd");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            } else {
                pwdInput.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        }
    </script>

</body>
</html>
