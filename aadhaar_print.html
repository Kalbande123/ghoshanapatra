<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhaar Card Service - SevaSpot</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- PDF.js for Reading PDF & jsPDF for Exporting HD PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="config.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { background-color: #f1f5f9; color: #1e293b; padding: 20px; text-align: center; }
        
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; position: relative; }
        
        /* Back Button */
        .back-link { position: absolute; top: 20px; right: 20px; color: #2563eb; text-decoration: none; font-weight: 600; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }

        /* 🚨 WhatsApp Notice Box */
        .notice-box { background: #dcfce7; border: 1px solid #22c55e; color: #166534; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 30px; }
        .notice-box a { color: #166534; text-decoration: none; border-bottom: 1px dashed #166534; }
        
        /* Heading */
        h2 { color: #ea580c; margin-bottom: 20px; border-bottom: 2px solid #ea580c; padding-bottom: 10px; display: inline-block; font-size: 24px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; }
        
        .btn-process { background-color: #2563eb; color: white; border: none; padding: 14px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-process:hover { background-color: #1d4ed8; }
        
        .btn-download { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; border: none; padding: 14px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: none; transition: 0.3s; }
        .btn-download:hover { opacity: 0.9; box-shadow: 0 4px 10px rgba(234, 88, 12, 0.3); }

        .btn-success { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: white; padding: 14px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: none; text-decoration: none; }
        
        .error { color: red; font-weight: bold; display: none; margin-top: 10px; }
        
        .success-strip { background: #dcfce7; border: 1px solid #22c55e; color: #166534; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; display: none; }

        canvas { display: none; } 
    </style>
</head>
<body>

    <div class="container">
        <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i> डॅशबोर्डवर जा</a>

        <div class="notice-box">
            <i class="fab fa-whatsapp" style="font-size: 24px; color: #25D366;"></i> 
            <span>टोकन संपल्यास रिचार्जसाठी <a href="https://wa.me/919999999999" target="_blank">9999999999</a> वर संपर्क साधा.</span>
        </div>

        <h2><i class="fas fa-fingerprint"></i> आधार कार्ड सेवा</h2>
        
        <div class="form-group">
            <label>पेपरची साईझ निवडा:</label>
            <select id="printSize">
                <option value="4x6">4x6 Photo Paper</option>
                <option value="A4">A4 Full Size Paper</option>
            </select>
        </div>

        <div class="form-group">
            <label>आधारची PDF फाईल निवडा:</label>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>

        <div class="form-group">
            <label>PDF पासवर्ड (असल्यास):</label>
            <input type="password" id="pdfPassword" placeholder="उदा. तुमच्या नावाचे ४ अक्षर आणि जन्मवर्ष">
        </div>
        
        <button id="btnProcess" class="btn-process" onclick="processCard()"><i class="fas fa-cogs"></i> फाईल प्रोसेस करा</button>
        <p id="errorMsg" class="error"></p>
        
        <!-- Hidden Canvas for cropping -->
        <canvas id="idCanvas"></canvas>

        <div id="actionArea">
            <div id="successMsg" class="success-strip">
                <i class="fas fa-check-circle"></i> फाईल रेडी आहे! डाऊनलोड करण्यासाठी क्लिक करा.
            </div>
            
            <!-- फायनल डाऊनलोड बटन (तुमच्या घोषणापत्राच्या डिझाईननुसार) -->
            <button id="btnDownload" class="btn-download" onclick="deductTokenAndDownload()">
                <i class="fas fa-file-pdf"></i> HD PDF डाऊनलोड करा (5 टोकन)
            </button>

            <!-- सक्सेस झाल्यावर डॅशबोर्डवर जाण्याचे बटन -->
            <a href="home.html" id="btnGoHome" class="btn-success">
                <i class="fas fa-check-circle"></i> यशस्वी! डॅशबोर्डवर परत जा
            </a>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let currentSize = '4x6'; 

        function drawRoundedCard(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(dx + radius, dy);
            ctx.lineTo(dx + dw - radius, dy);
            ctx.quadraticCurveTo(dx + dw, dy, dx + dw, dy + radius);
            ctx.lineTo(dx + dw, dy + dh - radius);
            ctx.quadraticCurveTo(dx + dw, dy + dh, dx + dw - radius, dy + dh);
            ctx.lineTo(dx + radius, dy + dh);
            ctx.quadraticCurveTo(dx, dy + dh, dx, dy + dh - radius);
            ctx.lineTo(dx, dy + radius);
            ctx.quadraticCurveTo(dx, dy, dx + radius, dy);
            ctx.closePath();
            ctx.clip(); 
            ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
            ctx.lineWidth = 6; 
            ctx.strokeStyle = "#000000"; 
            ctx.stroke();
            ctx.restore();
        }

        async function processCard() {
            const fileInput = document.getElementById('pdfFile').files[0];
            const password = document.getElementById('pdfPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const btnDownload = document.getElementById('btnDownload');
            const btnProcess = document.getElementById('btnProcess');
            
            currentSize = document.getElementById('printSize').value;

            if (!fileInput) { alert("कृपया आधारची PDF फाईल निवडा."); return; }

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            btnDownload.style.display = 'none';
            
            btnProcess.innerHTML = "<i class='fas fa-spinner fa-spin'></i> प्रोसेस होत आहे...";
            btnProcess.disabled = true;

            const fileReader = new FileReader();
            
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const loadingTask = pdfjsLib.getDocument({ data: typedarray, password: password });
                    const pdf = await loadingTask.promise;
                    const page = await pdf.getPage(1);

                    const scale = 3.0; 
                    const viewport = page.getViewport({ scale: scale });

                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = viewport.width;
                    tempCanvas.height = viewport.height;

                    await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;

                    const CARD_ASPECT_RATIO = 1.586; 
                    const cropWidth = tempCanvas.width * 0.426; 
                    const cropHeight = cropWidth / CARD_ASPECT_RATIO; 
                    const cropY = tempCanvas.height * 0.722; 
                    const leftCropX = tempCanvas.width * 0.073;  
                    const rightCropX = tempCanvas.width * 0.502; 

                    const finalCanvas = document.getElementById('idCanvas');
                    const finalCtx = finalCanvas.getContext('2d');
                    
                    const drawWidth = 1040; 
                    const drawHeight = drawWidth / CARD_ASPECT_RATIO; 
                    const cornerRadius = 32; 

                    if (currentSize === '4x6') {
                        finalCanvas.width = 1200;  
                        finalCanvas.height = 1800; 
                        finalCtx.fillStyle = "white";
                        finalCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                        const marginX = (finalCanvas.width - drawWidth) / 2; 
                        const gapBetweenCards = 130; 
                        const topPadding = (finalCanvas.height - (drawHeight * 2) - gapBetweenCards) / 2;

                        drawRoundedCard(finalCtx, tempCanvas, leftCropX, cropY, cropWidth, cropHeight, marginX, topPadding, drawWidth, drawHeight, cornerRadius);
                        drawRoundedCard(finalCtx, tempCanvas, rightCropX, cropY, cropWidth, cropHeight, marginX, topPadding + drawHeight + gapBetweenCards, drawWidth, drawHeight, cornerRadius);
                    
                    } else if (currentSize === 'A4') {
                        finalCanvas.width = 2480;  
                        finalCanvas.height = 3508; 
                        finalCtx.fillStyle = "white";
                        finalCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                        const gapBetweenCards = 140; 
                        const startX = (finalCanvas.width - (drawWidth * 2 + gapBetweenCards)) / 2; 
                        const gapY = 38; 

                        drawRoundedCard(finalCtx, tempCanvas, leftCropX, cropY, cropWidth, cropHeight, startX, gapY, drawWidth, drawHeight, cornerRadius);
                        drawRoundedCard(finalCtx, tempCanvas, rightCropX, cropY, cropWidth, cropHeight, startX + drawWidth + gapBetweenCards, gapY, drawWidth, drawHeight, cornerRadius);

                        finalCtx.lineWidth = 3; 
                        finalCtx.strokeStyle = "#aaaaaa"; 
                        finalCtx.setLineDash([20, 15]); 
                        let cutLineY = gapY + drawHeight + (gapY / 2); 
                        finalCtx.beginPath();
                        finalCtx.moveTo(80, cutLineY); 
                        finalCtx.lineTo(finalCanvas.width - 80, cutLineY); 
                        finalCtx.stroke();
                        finalCtx.setLineDash([]);
                    }

                    successMsg.style.display = 'block';
                    btnDownload.style.display = 'block';
                    btnProcess.style.display = 'none'; // प्रोसेस बटन लपवले

                } catch (error) {
                    errorMsg.innerText = error.name === 'PasswordException' ? "चुकीचा पासवर्ड! आधारचा बरोबर पासवर्ड टाका." : "PDF प्रोसेस करण्यात अडचण आली.";
                    errorMsg.style.display = 'block';
                    btnProcess.innerHTML = "<i class='fas fa-cogs'></i> फाईल प्रोसेस करा";
                    btnProcess.disabled = false;
                }
            };
            fileReader.readAsArrayBuffer(fileInput);
        }

        // --- तुमच्या घोषणापत्राच्या पॅटर्ननुसार टोकन कपात ---
        function deductTokenAndDownload() {
            const btn = document.getElementById('btnDownload');
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> प्रक्रिया चालू आहे...";
            btn.disabled = true;

            // तुमच्या कोडप्रमाणे युजरनेम घेणे
            const username = localStorage.getItem('username') || localStorage.getItem("loggedInUser") || "9876543210";
            
            const formData = new FormData();
            formData.append('action', 'printIdCard');
            formData.append('username', username);
            formData.append('cardType', 'आधार कार्ड');
            formData.append('remark', currentSize + ' Size Export');

            fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    
                    // तुमच्या कोडप्रमाणे localStorage अपडेट करणे
                    let currentTokens = parseInt(localStorage.getItem('remainingTokens')) || 0;
                    if(currentTokens > 0) { 
                        localStorage.setItem('remainingTokens', currentTokens - 5); 
                    }

                    // फाईल डाऊनलोड करणे
                    exportToPDF();

                    // अर्ध्या सेकंदानंतर डाउनलोड बटन लपवून सक्सेस बटन दाखवणे
                    setTimeout(() => {
                        document.getElementById('successMsg').style.display = 'none';
                        btn.style.display = 'none';
                        document.getElementById('btnGoHome').style.display = 'block';
                    }, 500);

                } else {
                    alert("त्रुटी: " + data.message);
                    btn.innerHTML = "<i class='fas fa-file-pdf'></i> HD PDF डाऊनलोड करा (5 टोकन)";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert("नेटवर्क एरर! कृपया पुन्हा प्रयत्न करा.");
                btn.innerHTML = "<i class='fas fa-file-pdf'></i> HD PDF डाऊनलोड करा (5 टोकन)";
                btn.disabled = false;
            });
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const canvas = document.getElementById('idCanvas');
            const imgData = canvas.toDataURL('image/jpeg', 1.0); 
            
            let pdf;
            if (currentSize === '4x6') {
                pdf = new jsPDF({ orientation: 'portrait', unit: 'in', format: [4, 6] });
                pdf.addImage(imgData, 'JPEG', 0, 0, 4, 6);
            } else {
                pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
            }
            
            pdf.save('Aadhaar_Card_' + currentSize + '.pdf');
        }
    </script>
</body>
</html>
