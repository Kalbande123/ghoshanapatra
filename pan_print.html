<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart PAN Card Print & Edit</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="config.js"></script> <!-- 🟢 CONFIG फाईल जोडली -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Mukta', sans-serif; }
        body { background-color: #e2e8f0; color: #1e293b; padding: 20px; text-align: center; }
        
        .container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 600px; margin: auto; position: relative; padding-bottom: 30px;}
        
        .back-link { position: absolute; top: 20px; right: 20px; color: #4338ca; text-decoration: none; font-weight: 600; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }

        h2 { color: #4338ca; margin-bottom: 20px; border-bottom: 2px solid #4338ca; padding-bottom: 10px; display: inline-block; font-size: 24px; }
        
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .form-group input, .form-group select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; }
        
        .btn-process { background-color: #4338ca; color: white; border: none; padding: 14px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.3s;}
        .btn-process:hover { background-color: #3730a3; }
        
        .btn-download { background-color: #16a34a; color: white; border: none; padding: 14px; width: 100%; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; display: none; transition: 0.3s;}
        .btn-download:hover { background-color: #15803d; }

        .btn-reset { background-color: #64748b; color: white; border: none; padding: 10px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 15px; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-reset:hover { background-color: #475569; }

        /* एडिटिंग पॅनेल स्टाईल */
        #editPanel { background-color: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-top: 20px; display: none; text-align: left; }
        #editPanel h3 { font-size: 18px; color: #334155; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        #previewArea { text-align: center; margin-bottom: 15px; background: #fff; padding: 10px; border-radius: 8px; border: 1px dashed #cbd5e1; }
        #previewCanvas { max-width: 100%; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .preview-note { font-size: 13px; color: #64748b; margin-top: 5px; }

        .edit-control { margin-bottom: 10px; }
        .edit-control label { display: flex; justify-content: space-between; font-weight: 600; color: #475569; font-size: 14px; margin-bottom: 4px; }
        .edit-control span { color: #4338ca; font-weight: bold; }
        
        .edit-control input[type=range] { width: 100%; cursor: pointer; height: 8px; -webkit-appearance: none; background: #cbd5e1; border-radius: 5px; outline: none; }
        .edit-control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #4338ca; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        canvas#finalCanvas { display: none; } 
    </style>
</head>
<body>

    <div class="container">
        <a href="home.html" class="back-link"><i class="fas fa-arrow-left"></i> डॅशबोर्ड</a>

        <h2><i class="fas fa-id-card"></i> स्मार्ट पॅन कार्ड प्रिंट व एडिट</h2>
        
        <div class="form-group">
            <label>पेपरची साईझ निवडा:</label>
            <select id="printSize">
                <option value="4x6">4x6 Photo Paper (HD)</option>
                <option value="A4">A4 Full Size Paper</option>
            </select>
        </div>

        <div class="form-group">
            <label>पॅन कार्ड PDF फाईल निवडा:</label>
            <input type="file" id="pdfFile" accept="application/pdf">
        </div>

        <div class="form-group">
            <label>PDF पासवर्ड (जन्मतारीख):</label>
            <input type="password" id="pdfPassword" placeholder="उदा. DDMMYYYY">
        </div>
        
        <button id="btnProcess" class="btn-process" onclick="processCard()"><i class="fas fa-cogs"></i> फाईल प्रोसेस करा</button>
        <p id="errorMsg" style="color:red; display:none; margin-top:10px; font-weight:bold;"></p>
        
        <!-- 📷 फोटो एडिटिंग पॅनेल -->
        <div id="editPanel">
            <h3><i class="fas fa-image"></i> फक्त फोटो क्लिअर करा</h3>
            
            <div id="previewArea">
                <canvas id="previewCanvas"></canvas>
                <p class="preview-note"><i class="fas fa-info-circle"></i> आता बदल फक्त 'फोटो' वरच लागू होतील, पॅन कार्डचा मजकूर सुरक्षित राहील.</p>
            </div>

            <div class="edit-control">
                <label>प्रकाशन (Brightness): <span id="valBright">100%</span></label>
                <input type="range" id="rangeBrightness" min="50" max="150" value="100" oninput="applyEdits()">
            </div>
            
            <div class="edit-control">
                <label>कॉन्ट्रास्ट (Contrast): <span id="valContrast">100%</span></label>
                <input type="range" id="rangeContrast" min="50" max="150" value="100" oninput="applyEdits()">
            </div>

            <div class="edit-control">
                <label>रंग (Saturation): <span id="valSaturation">100%</span></label>
                <input type="range" id="rangeSaturation" min="0" max="200" value="100" oninput="applyEdits()">
            </div>

            <div class="edit-control">
                <label>ब्लॅक अँड व्हाईट (B & W): <span id="valGray">0%</span></label>
                <input type="range" id="rangeGray" min="0" max="100" value="0" oninput="applyEdits()">
            </div>

            <button class="btn-reset" onclick="resetEdits()"><i class="fas fa-undo"></i> रिसेट करा (मूळ स्वरूपात आणा)</button>
        </div>

        <button id="btnDownload" class="btn-download" onclick="deductTokenAndDownload()">
            <i class="fas fa-file-pdf"></i> HD PDF डाऊनलोड करा (10 टोकन)
        </button>

        <canvas id="finalCanvas"></canvas>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        
        let currentSize = '4x6';
        let rawCanvas = null; 
        let frontCropCanvas = null; 
        let cropParams = {};

        // =========================================================================
        const CARD_TOP_Y = 0.770;    
        const CARD_WIDTH = 0.420;    
        const LEFT_SIDE_X = 0.100;   
        const RIGHT_SIDE_X = 0.510;  
        
        const PHOTO_X_PERCENT = 0.058;  
        const PHOTO_Y_PERCENT = 0.256;  
        const PHOTO_W_PERCENT = 0.170;  
        const PHOTO_H_PERCENT = 0.269;  
        // =========================================================================

        function drawRoundedCard(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh, radius) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(dx + radius, dy);
            ctx.lineTo(dx + dw - radius, dy);
            ctx.quadraticCurveTo(dx + dw, dy, dx + dw, dy + radius);
            ctx.lineTo(dx + dw, dy + dh - radius);
            ctx.quadraticCurveTo(dx + dw, dy + dh, dx + dw - radius, dy + dh);
            ctx.lineTo(dx + radius, dy + dh);
            ctx.quadraticCurveTo(dx, dy + dh, dx, dy + dh - radius);
            ctx.lineTo(dx, dy + radius);
            ctx.quadraticCurveTo(dx, dy, dx + radius, dy);
            ctx.closePath();
            ctx.clip(); 
            ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh);
            ctx.lineWidth = 6; 
            ctx.strokeStyle = "#000000"; 
            ctx.stroke();
            ctx.restore();
        }

        async function processCard() {
            const fileInput = document.getElementById('pdfFile').files[0];
            const password = document.getElementById('pdfPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const editPanel = document.getElementById('editPanel');
            const btnDownload = document.getElementById('btnDownload');
            const btnProcess = document.getElementById('btnProcess');
            
            currentSize = document.getElementById('printSize').value;

            if (!fileInput) { alert("कृपया PDF फाईल निवडा."); return; }

            errorMsg.style.display = 'none';
            editPanel.style.display = 'none';
            btnDownload.style.display = 'none';
            btnProcess.innerHTML = "<i class='fas fa-spinner fa-spin'></i> लोड होत आहे...";
            btnProcess.disabled = true;

            const fileReader = new FileReader();
            
            fileReader.onload = async function() {
                const typedarray = new Uint8Array(this.result);
                try {
                    const loadingTask = pdfjsLib.getDocument({ data: typedarray, password: password });
                    const pdf = await loadingTask.promise;
                    const page = await pdf.getPage(1);

                    const scale = 4.0; 
                    const viewport = page.getViewport({ scale: scale });

                    rawCanvas = document.createElement('canvas');
                    const rawCtx = rawCanvas.getContext('2d');
                    rawCanvas.width = viewport.width;
                    rawCanvas.height = viewport.height;
                    await page.render({ canvasContext: rawCtx, viewport: viewport }).promise;

                    const CARD_ASPECT_RATIO = 1.586; 
                    
                    cropParams.sw = rawCanvas.width * CARD_WIDTH; 
                    cropParams.sh = cropParams.sw / CARD_ASPECT_RATIO; 
                    cropParams.sy = rawCanvas.height * CARD_TOP_Y; 
                    cropParams.sLeftX = rawCanvas.width * LEFT_SIDE_X; 
                    cropParams.sRightX = rawCanvas.width * RIGHT_SIDE_X; 

                    frontCropCanvas = document.createElement('canvas');
                    frontCropCanvas.width = cropParams.sw;
                    frontCropCanvas.height = cropParams.sh;
                    const frontCtx = frontCropCanvas.getContext('2d');
                    frontCtx.drawImage(rawCanvas, cropParams.sLeftX, cropParams.sy, cropParams.sw, cropParams.sh, 0, 0, cropParams.sw, cropParams.sh);

                    resetEdits(); 
                    
                    editPanel.style.display = 'block';
                    btnDownload.style.display = 'block';
                    btnProcess.innerHTML = "<i class='fas fa-cogs'></i> फाईल प्रोसेस करा";
                    btnProcess.disabled = false;

                } catch (error) {
                    if (error.name === 'PasswordException') {
                        errorMsg.innerText = "पासवर्ड चुकीचा आहे! पॅन कार्डची जन्मतारीख (DDMMYYYY) टाका.";
                    } else {
                        errorMsg.innerText = "PDF प्रोसेस करण्यात अडचण आली.";
                    }
                    errorMsg.style.display = 'block';
                    btnProcess.innerHTML = "<i class='fas fa-cogs'></i> फाईल प्रोसेस करा";
                    btnProcess.disabled = false;
                }
            };
            fileReader.readAsArrayBuffer(fileInput);
        }

        function resetEdits() {
            document.getElementById('rangeBrightness').value = 100;
            document.getElementById('rangeContrast').value = 100;
            document.getElementById('rangeSaturation').value = 100;
            document.getElementById('rangeGray').value = 0;
            applyEdits();
        }

        function applyEdits() {
            if(!frontCropCanvas) return;

            const brightness = document.getElementById('rangeBrightness').value;
            const contrast = document.getElementById('rangeContrast').value;
            const saturation = document.getElementById('rangeSaturation').value;
            const grayscale = document.getElementById('rangeGray').value;
            
            document.getElementById('valBright').innerText = brightness + "%";
            document.getElementById('valContrast').innerText = contrast + "%";
            document.getElementById('valSaturation').innerText = saturation + "%";
            document.getElementById('valGray').innerText = grayscale + "%";

            const previewCanvas = document.getElementById('previewCanvas');
            const pCtx = previewCanvas.getContext('2d');
            previewCanvas.width = frontCropCanvas.width;
            previewCanvas.height = frontCropCanvas.height;
            
            pCtx.filter = 'none';
            pCtx.drawImage(frontCropCanvas, 0, 0);

            const pX = frontCropCanvas.width * PHOTO_X_PERCENT;
            const pY = frontCropCanvas.height * PHOTO_Y_PERCENT;
            const pW = frontCropCanvas.width * PHOTO_W_PERCENT;
            const pH = frontCropCanvas.height * PHOTO_H_PERCENT;

            pCtx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) grayscale(${grayscale}%)`;
            pCtx.drawImage(frontCropCanvas, pX, pY, pW, pH, pX, pY, pW, pH);
        }

        function generateFinalCanvas() {
            const finalCanvas = document.getElementById('finalCanvas');
            const finalCtx = finalCanvas.getContext('2d');
            
            const brightness = document.getElementById('rangeBrightness').value;
            const contrast = document.getElementById('rangeContrast').value;
            const saturation = document.getElementById('rangeSaturation').value;
            const grayscale = document.getElementById('rangeGray').value;

            if (currentSize === '4x6') {
                finalCanvas.width = 1200; finalCanvas.height = 1800; 
            } else {
                finalCanvas.width = 2480; finalCanvas.height = 3508; 
            }
            finalCtx.fillStyle = "white";
            finalCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = rawCanvas.width;
            tempCanvas.height = rawCanvas.height;
            
            tempCtx.filter = 'none';
            tempCtx.drawImage(rawCanvas, 0, 0); 

            const absPX = cropParams.sLeftX + (cropParams.sw * PHOTO_X_PERCENT);
            const absPY = cropParams.sy + (cropParams.sh * PHOTO_Y_PERCENT);
            const pW = cropParams.sw * PHOTO_W_PERCENT;
            const pH = cropParams.sh * PHOTO_H_PERCENT;

            tempCtx.filter = `brightness(${brightness}%) contrast(${contrast}%) saturate(${saturation}%) grayscale(${grayscale}%)`;
            tempCtx.drawImage(rawCanvas, absPX, absPY, pW, pH, absPX, absPY, pW, pH);

            const CARD_ASPECT_RATIO = 1.586;
            const drawWidth = 1040; 
            const drawHeight = drawWidth / CARD_ASPECT_RATIO; 
            const cornerRadius = 32; 

            if (currentSize === '4x6') {
                const marginX = (finalCanvas.width - drawWidth) / 2; 
                const gapBetweenCards = 130; 
                const topPadding = (finalCanvas.height - (drawHeight * 2) - gapBetweenCards) / 2;

                drawRoundedCard(finalCtx, tempCanvas, cropParams.sLeftX, cropParams.sy, cropParams.sw, cropParams.sh, marginX, topPadding, drawWidth, drawHeight, cornerRadius);
                drawRoundedCard(finalCtx, tempCanvas, cropParams.sRightX, cropParams.sy, cropParams.sw, cropParams.sh, marginX, topPadding + drawHeight + gapBetweenCards, drawWidth, drawHeight, cornerRadius);
            
            } else if (currentSize === 'A4') {
                const gapBetweenCards = 140; 
                const startX = (finalCanvas.width - (drawWidth * 2 + gapBetweenCards)) / 2; 
                const gapY = 38; 

                drawRoundedCard(finalCtx, tempCanvas, cropParams.sLeftX, cropParams.sy, cropParams.sw, cropParams.sh, startX, gapY, drawWidth, drawHeight, cornerRadius);
                drawRoundedCard(finalCtx, tempCanvas, cropParams.sRightX, cropParams.sy, cropParams.sw, cropParams.sh, startX + drawWidth + gapBetweenCards, gapY, drawWidth, drawHeight, cornerRadius);

                finalCtx.lineWidth = 3; 
                finalCtx.strokeStyle = "#aaaaaa"; 
                finalCtx.setLineDash([20, 15]); 
                let cutLineY = gapY + drawHeight + (gapY / 2); 
                finalCtx.beginPath();
                finalCtx.moveTo(80, cutLineY); 
                finalCtx.lineTo(finalCanvas.width - 80, cutLineY); 
                finalCtx.stroke();
                finalCtx.setLineDash([]);
            }
        }

        // 🟢 १० टोकन कट करण्याची मुख्य API सिस्टीम 🟢
        function deductTokenAndDownload() {
            const btn = document.getElementById('btnDownload');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> प्रक्रिया चालू आहे...";
            btn.disabled = true;

            let username = localStorage.getItem('username') || localStorage.getItem("loggedInUser") || "9876543210";

            if(!username || username === "9876543210") {
                username = prompt("सिस्टीमला तुमचा आयडी मिळाला नाही. टोकन कट करण्यासाठी कृपया तुमचा रजिस्टर मोबाईल नंबर किंवा युजरनेम टाका:");
                if(!username || username.trim() === "") {
                    btn.innerHTML = originalHtml; 
                    btn.disabled = false;
                    return alert("टोकन कट करण्यासाठी आयडी आवश्यक आहे!");
                }
                localStorage.setItem("username", username);
            }

            let formData = new FormData();
            formData.append('action', 'printIdCard');
            formData.append('username', username);
            formData.append('cardType', 'पॅन कार्ड (PAN)'); // 🟢 अचूक सर्व्हिसचे नाव
            formData.append('remark', document.getElementById('printSize').value + ' Size Export');

            // API Call
            fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    // लोकल बॅलन्स अपडेट करणे
                    let currentTokens = parseInt(localStorage.getItem('remainingTokens')) || 0;
                    if(currentTokens >= 10) { localStorage.setItem('remainingTokens', currentTokens - 10); }

                    // फायनल कॅनव्हास बनवून पीडीएफ डाऊनलोड करणे
                    generateFinalCanvas();
                    exportToPDF();

                    setTimeout(() => {
                        window.location.href = "home.html"; // डॅशबोर्डवर परत जा
                    }, 1500);
                } else {
                    alert("त्रुटी: " + data.message); // बॅलन्स नसेल तर एरर
                    btn.innerHTML = originalHtml; 
                    btn.disabled = false;
                }
            })
            .catch(err => {
                alert("नेटवर्क एरर! कृपया इंटरनेट तपासा आणि पुन्हा प्रयत्न करा.");
                btn.innerHTML = originalHtml; 
                btn.disabled = false;
            });
        }

        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const printSize = document.getElementById('printSize').value;
            const canvas = document.getElementById('finalCanvas');
            const imgData = canvas.toDataURL('image/jpeg', 1.0); 
            
            let pdf;
            if (printSize === '4x6') {
                pdf = new jsPDF({ orientation: 'portrait', unit: 'in', format: [4, 6] });
                pdf.addImage(imgData, 'JPEG', 0, 0, 4, 6, undefined, 'FAST');
            } else {
                pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
                pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
            }
            
            const ts = new Date().getTime();
            pdf.save(`Smart_PAN_${currentSize}_${ts}.pdf`);
        }
    </script>
</body>
</html>
